<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're In — Beyond Pages</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0d10; --navy:#12141c; --gold:#c9a227; --gold-light:#e3c565;
    --cream:#f5f1e8; --muted:#8f8b7f;
    --serif:'Cormorant Garamond',serif; --sans:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--sans);background:var(--navy);color:var(--cream);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:32px;
    background-image:radial-gradient(circle at 18% 25%, rgba(201,162,39,0.10), transparent 55%),
                      radial-gradient(circle at 85% 80%, rgba(44,80,73,0.35), transparent 55%);
  }
  .inner{max-width:460px;}
  .divider{width:44px;height:2px;background:var(--gold);margin:0 auto 22px;}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,5vw,40px);margin-bottom:16px;}
  p{color:rgba(245,241,232,0.7);font-size:15.5px;line-height:1.7;margin-bottom:32px;}
  a.back{color:var(--gold-light);text-decoration:none;font-size:14px;letter-spacing:0.4px;}
  a.back:hover{color:var(--cream);}
</style>
</head>
<body>
  <div class="inner">
    <div class="divider"></div>
    <h1>You're In</h1>
    <p>Thanks for joining the Beyond Pages list — keep an eye on your inbox for new releases, podcast episodes, and reflections you won't find anywhere else.</p>
    <a class="back" href="index.html">&larr; Back to Beyond Pages</a>
  </div>
</body>
</html>
